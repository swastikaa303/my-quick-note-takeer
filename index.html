<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note It, down</title>
    <style>
        /* =========================================
           CSS VARIABLES (For perfect Light/Dark Mode)
           ========================================= */
        :root {
            --bg-app: #f3f4f6;
            --bg-panel: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent-color: #9d2a8e;
            --accent-hover: #21867a;
            --btn-text: #ffffff;
            --danger-color: #ef4444;
            --danger-hover: #266fdc;
            --item-hover: #f9fafb;
            --item-active: #e6f7f5;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body.dark-mode {
            --bg-app: #111827;
            --bg-panel: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --accent-color: #9d2a8e;
            --accent-hover: #0ea5e9;
            --item-hover: #374151;
            --item-active: #1e3a8a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           GLOBAL STYLES
           ========================================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-app);
            color: var(--text-main);
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
            /* Prevents whole page from scrolling */
        }

        /* =========================================
           SIDEBAR
           ========================================= */
        #sidebar {
            width: 280px;
            background: var(--bg-panel);
            padding: 20px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        #sidebar h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        #note-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom Scrollbar for Sidebar */
        #note-list::-webkit-scrollbar {
            width: 6px;
        }

        #note-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #note-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .note-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            position: relative;
            background: var(--bg-panel);
            transition: all 0.2s ease;
        }

        .note-item:hover {
            background: var(--item-hover);
            border-color: var(--border-color);
        }

        .note-item.active {
            background: var(--item-active);
            border-color: var(--accent-color);
        }

        .note-item strong {
            display: block;
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 4px;
            padding-right: 25px;
            /* space for delete btn */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-item small {
            color: var(--text-muted);
            font-size: 12px;
        }

        .delete-btn {
            position: absolute;
            right: 10px;
            top: 12px;
            background: var(--danger-color) !important;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            /* Hide until hover */
            transition: opacity 0.2s ease, background 0.2s ease;
            padding: 0 !important;
        }

        .note-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: var(--danger-hover) !important;
        }

        /* =========================================
           EDITOR AREA
           ========================================= */
        .editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            padding: 20px;
            position: relative;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .save-status {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            font-style: italic;
        }

        .undo-redo-buttons {
            display: flex;
            gap: 5px;
        }

        .undo-redo-buttons button {
            background-color: var(--bg-app);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .undo-redo-buttons button:hover {
            background-color: var(--item-hover);
        }

        textarea {
            flex: 1;
            width: 100%;
            font-size: 16px;
            line-height: 1.6;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            resize: none;
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: inherit;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        /* =========================================
           TOOLBAR (Bottom Buttons)
           ========================================= */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Specific Button Styles */
        #toggle-mode {
            background: var(--bg-app);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            margin-left: auto;
            /* Pushes Dark Mode btn to the right */
        }

        #toggle-mode:hover {
            background: var(--item-hover);
        }
    </style>
</head>

<body>

    <h1>📝 Note it, down</h1>

    <div class="container">

        <!-- SIDEBAR -->
        <div id="sidebar">
            <h3>My Notes</h3>
            <div id="note-list">
                <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 20px;">
                    No saved notes.
                </p>
            </div>
        </div>

        <!-- EDITOR AREA -->
        <div class="editor">

            <!-- Editor Top Header (Status + Undo/Redo) -->
            <div class="editor-header">
                <p id="save-status" class="save-status">Ready to type...</p>

                <div class="undo-redo-buttons">
                    <button id="undo" title="Undo (Ctrl+Z)">↩️</button>
                    <button id="redo" title="Redo (Ctrl+Y)">↪️</button>
                </div>
            </div>

            <!-- Text Area -->
            <textarea id="note" placeholder="Start typing your beautiful note here..."></textarea>

            <!-- Main Actions Toolbar -->
            <div class="toolbar">
                <button id="new-note">🆕 New Note</button>
                <button id="save">💾 Save</button>
                <button id="save-as">📂 Save As...</button>
                <button id="open-file">📁 Open File</button>

                <div style="margin-left: auto; display: flex; gap: 10px;">
                    <button id="font-dec" title="Decrease font size">A-</button>
                    <button id="font-inc" title="Increase font size">A+</button>
                    <button id="toggle-mode">🌓 Toggle Theme</button>
                </div>
            </div>

        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
